<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages serves this for unknown paths (e.g. /admin, /blog).
      // The app uses hash routing, so send /some/path → /#/some/path.
      var l = window.location;
      var route = l.pathname.replace(/^\/+|\/+$/g, '');
      l.replace(l.origin + '/' + l.search + '#/' + route);
    </script>
  </head>
  <body>
  </body>
</html>
